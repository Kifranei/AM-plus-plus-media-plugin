name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify host references
        run: python3 -B scripts/verify-sdk.py
      - name: Build and test
        run: ./gradlew :media-plugin:testDebugUnitTest :media-plugin:lintDebug :media-plugin:pluginZip --no-daemon
      - name: Verify plugin ZIP
        run: python3 -B scripts/verify-media-plugin.py media-plugin/build/dist/ampp-media-integrations-1.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ampp-media-integrations
          path: media-plugin/build/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            media-plugin/build/reports/tests/
            media-plugin/build/reports/lint-results-debug.*
